intro: |
  I'm a Research Scientist at Alibaba **Wan Team**, where I serve as a core contributor of Wan3.0, Wan2.7, Wan2.6 and Wan2.5. I also hold a research position at Zhejiang University, working closely with Prof. [Yi Yang](https://scholar.google.com/citations?hl=en&user=RMSuNFwAAAAJ). I obtained my Ph.D. in Computer Science from [Fudan University](https://www.fudan.edu.cn/en/), supervised by Prof. [Yu-Gang Jiang](https://scholar.google.com/citations?user=f3_FP8AAAAAJ&hl=en) (IEEE Fellow) and Prof. [Zuxuan Wu](https://zxwu.azurewebsites.net/).

contact: "If you are interested in discussing potential collaborations, please feel free to email me at [zhenxingfd@gmail.com](mailto:zhenxingfd@gmail.com)."

