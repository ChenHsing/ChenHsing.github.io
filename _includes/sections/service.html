<section class="home-section" id="academic-service">
<header class="section-head">
<h2>🎓 Academic Service</h2>
</header>
<div class="service-grid">
<div class="service-col">
<h3 class="sub-heading">Conference Program Committee</h3>
<ul class="entry-list entry-list--plain">
{% for c in site.data.service.conferences %}
<li class="entry entry--bare"><span class="entry__body"><span class="entry__title">{{ c.name }}</span></span></li>
{% endfor %}
</ul>
</div>
<div class="service-col">
<h3 class="sub-heading">Journal Reviewer</h3>
<ul class="entry-list entry-list--plain">
{% for j in site.data.service.journals %}
<li class="entry entry--bare"><span class="entry__body"><span class="entry__title">{{ j.name }}</span></span></li>
{% endfor %}
</ul>
</div>
</div>
</section>
